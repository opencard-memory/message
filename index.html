<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCard Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #e5edf5; }
        .hidden { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 md:p-4">

    <!-- Toast Notifications -->
    <div id="toastHost" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 w-[92vw] max-w-sm pointer-events-none" role="status" aria-live="polite"></div>

    <!-- Login/Signup Container -->
    <div id="authContainer" class="bg-white p-6 md:p-8 rounded-xl shadow-xl w-full max-w-sm border border-blue-100">
        <!-- Login Box -->
        <div class="box" id="loginBox">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-blue-600 to-sky-500 flex items-center justify-center shadow" aria-hidden="true"><i class="fas fa-comments text-white text-3xl"></i></div>
                <h1 class="text-2xl font-bold text-gray-800">OpenCard Message</h1>
                <p class="text-xs text-gray-500 mt-1">로그인하여 대화를 시작하세요</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 계정</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">로그인</button>
            </div>
            <div class="mt-6 text-center border-t pt-4">
                <p class="text-xs text-gray-600">계정이 없으신가요?</p>
                <button id="showSignupBtn" class="text-blue-600 font-semibold text-sm hover:underline mt-1">새 계정 만들기</button>
            </div>
        </div>

        <!-- Signup Box -->
        <div class="box hidden" id="signupBox">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-blue-600 to-sky-500 flex items-center justify-center shadow" aria-hidden="true"><i class="fas fa-comments text-white text-3xl"></i></div>
                <h1 class="text-xl font-bold text-gray-800">회원가입</h1>
                <p class="text-xs text-gray-500 mt-1">새 OpenCard 계정을 만듭니다</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">이메일 계정</label>
                    <input type="email" id="signupEmail" placeholder="example@email.com" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호</label>
                    <input type="password" id="signupPassword" placeholder="8자 이상 입력" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">비밀번호 확인</label>
                    <input type="password" id="signupConfirm" placeholder="비밀번호 재입력" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button id="signupBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">가입 완료</button>
            </div>
            <div class="mt-6 text-center border-t pt-4">
                <button id="backToLoginBtn" class="text-blue-600 font-semibold text-sm hover:underline">로그인 화면으로 돌아가기</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="mainApp" class="hidden w-full h-[95vh] max-w-5xl bg-white flex flex-col shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
        <!-- Navigation Header -->
        <header class="flex justify-between items-center p-3 bg-gradient-to-r from-blue-600 to-sky-500 text-white px-6">
            <div class="flex items-center space-x-3">
                <i class="fas fa-comments text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">OpenCard Message</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <button id="navChatBtn" class="nav-btn bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
                        <i class="fas fa-paper-plane"></i>
                        <span>메시지</span>
                    </button>
                    <button id="navProfileBtn" class="nav-btn bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
                        <i class="fas fa-user-gear"></i>
                        <span>프로필 설정</span>
                    </button>
                </div>

                <!-- Profile Dropdown Avatar -->
                <div class="relative pl-2 border-l border-white/20">
                    <div class="flex items-center space-x-2 cursor-pointer" id="profileDropdownTrigger">
                        <img id="myProfilePic" src="https://via.placeholder.com/36" class="w-9 h-9 rounded-full border-2 border-white object-cover">
                        <i class="fas fa-chevron-down text-xs opacity-80"></i>
                    </div>
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-20 text-gray-800">
                        <div class="px-4 py-2 border-b">
                            <p id="myUserEmail" class="text-xs font-semibold truncate text-gray-800"></p>
                            <p id="myUserStatus" class="text-[11px] text-gray-500 truncate italic"></p>
                        </div>
                        <button id="logoutBtn" class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 flex items-center space-x-2">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>로그아웃</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main View Area -->
        <main class="flex-1 overflow-hidden bg-gray-50 flex">
            <!-- Chat View -->
            <div id="chatView" class="view-container w-full h-full flex">
                <!-- Sidebar: Friends List & Add Friend -->
                <div class="w-80 bg-white border-r border-gray-200 flex flex-col h-full">
                    <div class="p-3 border-b border-gray-100 bg-slate-50">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">친구 추가</label>
                        <div class="flex space-x-2">
                            <input type="email" id="addFriendEmail" placeholder="친구 이메일 입력" class="flex-1 p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <button id="addFriendBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-semibold transition">추가</button>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-3 custom-scrollbar">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-1">대화 상대 목록</h3>
                        <ul id="friendsList" class="space-y-1"></ul>
                    </div>
                </div>

                <!-- Main Chat Window Area -->
                <div id="chatContainer" class="flex-1 bg-slate-100 flex flex-col h-full relative">
                    <div id="noChatSelected" class="flex flex-col items-center justify-center h-full text-gray-400">
                        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-3">
                            <i class="far fa-comments text-3xl text-blue-500"></i>
                        </div>
                        <p class="text-sm font-medium text-gray-600">친구를 선택하여 메시지를 주고받으세요.</p>
                        <p class="text-xs text-gray-400 mt-1">왼쪽 친구 목록에서 대화 상대를 클릭하세요.</p>
                    </div>
                </div>
            </div>

            <!-- Profile Settings View -->
            <div id="profileView" class="view-container hidden w-full h-full p-6 md:p-10 overflow-y-auto">
                <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold text-gray-800 mb-6 border-b pb-3 flex items-center space-x-2">
                        <i class="fas fa-user-pen text-blue-600"></i>
                        <span>내 사용자 프로필 설정</span>
                    </h2>
                    
                    <div class="flex flex-col items-center mb-6">
                        <div class="relative group">
                            <img id="profileEditPic" src="https://via.placeholder.com/96" class="w-24 h-24 rounded-full object-cover border-4 border-blue-50 shadow">
                            <label for="profilePicInput" class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 cursor-pointer transition">
                                <i class="fas fa-camera text-lg"></i>
                            </label>
                        </div>
                        <input type="file" id="profilePicInput" class="hidden" accept="image/*">
                        <label for="profilePicInput" class="mt-2 text-xs font-semibold text-blue-600 hover:underline cursor-pointer">프로필 사진 변경</label>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">상태 메시지</label>
                            <input type="text" id="profilePersonalMessage" placeholder="오늘의 상태 메시지를 입력하세요" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button id="saveProfileBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">설정 저장</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Templates -->
    <template id="chatWindowTemplate">
        <div class="chat-window flex flex-col h-full w-full bg-white">
            <!-- Chat Room Header -->
            <div class="p-3 bg-white border-b border-gray-200 flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-3">
                    <img class="chat-profile-pic w-10 h-10 rounded-full object-cover border border-gray-200" src="https://via.placeholder.com/40" alt="Friend">
                    <div>
                        <p class="chat-friend-name font-bold text-sm text-gray-800"></p>
                        <p class="chat-friend-status text-xs text-gray-500 italic"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="nudge-btn bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1 transition" title="대화창 흔들기">
                        <i class="fas fa-bell"></i>
                        <span>흔들기</span>
                    </button>
                    <button class="close-chat-btn text-gray-400 hover:text-gray-600 p-1.5 rounded-lg">
                        <i class="fas fa-times text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Messages Stream Area -->
            <div class="chat-messages flex-1 p-4 overflow-y-auto bg-slate-50 custom-scrollbar space-y-3"></div>

            <!-- Message Input Area -->
            <div class="p-3 bg-white border-t border-gray-200">
                <div class="flex items-center space-x-2">
                    <textarea class="chat-input flex-1 p-2.5 border border-gray-300 rounded-lg text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 custom-scrollbar" rows="2" placeholder="메시지를 입력하세요... (Enter 키로 전송)"></textarea>
                    <button class="send-msg-btn bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg text-sm font-semibold transition">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, where, orderBy, serverTimestamp, updateDoc, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCsHoRusN4SNrnGQTq-hb9s0y7ePZ5njUc",
            authDomain: "windowslivemassage.firebaseapp.com",
            projectId: "windowslivemassage",
            storageBucket: "windowslivemassage.appspot.com",
            messagingSenderId: "613096747595",
            appId: "1:613096747595:web:924e359a0b477970d2d3ce"
        };
        
        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // ---- Notifications & friendly Firebase errors ----
        const ERROR_MESSAGES = {
            // Auth
            'auth/invalid-email': '이메일 형식이 올바르지 않아요. 예: example@email.com',
            'auth/missing-email': '이메일을 입력해 주세요.',
            'auth/missing-password': '비밀번호를 입력해 주세요.',
            'auth/user-not-found': '이메일 또는 비밀번호가 올바르지 않아요.',
            'auth/wrong-password': '이메일 또는 비밀번호가 올바르지 않아요.',
            'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않아요.',
            'auth/invalid-login-credentials': '이메일 또는 비밀번호가 올바르지 않아요.',
            'auth/email-already-in-use': '이미 가입된 이메일이에요. 로그인해 주세요.',
            'auth/weak-password': '비밀번호가 너무 짧거나 쉬워요. 더 길고 복잡하게 만들어 주세요.',
            'auth/too-many-requests': '시도 횟수가 너무 많아요. 잠시 후 다시 시도해 주세요.',
            'auth/user-disabled': '사용이 중지된 계정이에요.',
            'auth/network-request-failed': '네트워크에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.',
            'auth/operation-not-allowed': '이메일 로그인이 아직 켜져 있지 않아요. Firebase 콘솔의 Authentication에서 이메일/비밀번호를 사용 설정해 주세요.',
            'auth/requires-recent-login': '보안을 위해 다시 로그인한 뒤 시도해 주세요.',
            'auth/internal-error': '서버에서 문제가 생겼어요. 잠시 후 다시 시도해 주세요.',
            // Firestore
            'permission-denied': '이 작업을 할 권한이 없어요. 로그인 상태나 Firestore 보안 규칙을 확인해 주세요.',
            'unauthenticated': '로그인이 필요해요. 다시 로그인해 주세요.',
            'unavailable': '서버에 연결할 수 없어요. 인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요.',
            'deadline-exceeded': '서버 응답이 너무 늦어요. 잠시 후 다시 시도해 주세요.',
            'not-found': '요청한 데이터를 찾을 수 없어요.',
            'already-exists': '이미 존재하는 데이터예요.',
            'resource-exhausted': '사용량 한도를 넘었어요. 잠시 후 다시 시도해 주세요.',
            'failed-precondition': '이 조회에는 Firestore 색인이 필요해요. 브라우저 콘솔(F12)의 링크로 색인을 만들어 주세요.',
            'invalid-argument': '잘못된 값이 전달됐어요.',
            'aborted': '동시에 여러 작업이 겹쳐 중단됐어요. 다시 시도해 주세요.',
            'cancelled': '작업이 취소됐어요.',
            'internal': '서버에서 문제가 생겼어요. 잠시 후 다시 시도해 주세요.',
            // Storage
            'storage/unauthorized': '파일을 올릴 권한이 없어요. Storage 보안 규칙을 확인해 주세요.',
            'storage/unauthenticated': '로그인이 필요해요. 다시 로그인해 주세요.',
            'storage/canceled': '파일 업로드가 취소됐어요.',
            'storage/quota-exceeded': '저장 공간이 가득 찼어요.',
            'storage/retry-limit-exceeded': '업로드 시간이 너무 오래 걸려 중단됐어요. 네트워크를 확인하고 다시 시도해 주세요.',
            'storage/object-not-found': '파일을 찾을 수 없어요.',
            'storage/bucket-not-found': 'Storage 버킷을 찾을 수 없어요. Firebase 설정을 확인해 주세요.',
            'storage/invalid-checksum': '파일이 올바르게 전송되지 않았어요. 다시 시도해 주세요.'
        };

        // Turns a Firebase error into a plain Korean sentence. `lead` is an optional first sentence (e.g. "로그인하지 못했어요.").
        function friendlyError(err, lead = '') {
            const raw = (err && err.code) ? String(err.code) : '';
            const code = raw.replace(/^firestore\//, '');
            let reason = ERROR_MESSAGES[raw] || ERROR_MESSAGES[code];
            if (!reason) {
                if (!navigator.onLine) reason = '인터넷에 연결되어 있지 않아요. 연결을 확인해 주세요.';
                else reason = '알 수 없는 오류가 발생했어요. 잠시 후 다시 시도해 주세요.' + (raw ? ` (오류 코드: ${raw})` : '');
            }
            console.error('[OpenCard Message]', lead, err);
            return lead ? `${lead} ${reason}` : reason;
        }

        function notify(message, type = 'info') {
            const host = document.getElementById('toastHost');
            if (!host) return;
            // Skip duplicates that are already on screen
            for (const el of host.children) { if (el.dataset.msg === message) return; }

            const styles = {
                error: 'bg-red-50 text-red-800 border-red-200',
                success: 'bg-green-50 text-green-800 border-green-200',
                info: 'bg-white text-gray-800 border-gray-200'
            };
            const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };

            const el = document.createElement('div');
            el.dataset.msg = message;
            el.className = `pointer-events-auto w-full flex items-start gap-2 px-4 py-3 rounded-xl border shadow-lg text-sm ${styles[type] || styles.info}`;
            const icon = document.createElement('i');
            icon.className = `fas ${icons[type] || icons.info} mt-0.5`;
            const text = document.createElement('span');
            text.className = 'flex-1 break-words';
            text.textContent = message;
            const close = document.createElement('button');
            close.type = 'button';
            close.setAttribute('aria-label', '닫기');
            close.className = 'opacity-60 hover:opacity-100';
            close.innerHTML = '<i class="fas fa-xmark"></i>';
            el.append(icon, text, close);
            host.appendChild(el);

            const remove = () => el.remove();
            close.addEventListener('click', remove);
            setTimeout(remove, type === 'error' ? 7000 : 4000);
        }

        // Global State
        let currentUser = null;
        let unsubscribeListeners = [];

        // UI Auth Switching
        document.getElementById('showSignupBtn').addEventListener('click', () => {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('signupBox').classList.remove('hidden');
        });
        document.getElementById('backToLoginBtn').addEventListener('click', () => {
            document.getElementById('signupBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
        });

        // Login Action
        document.getElementById("loginBtn").addEventListener("click", async () => {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            if(!email || !password) return notify("이메일과 비밀번호를 모두 입력해 주세요.", "error");

            try { 
                await signInWithEmailAndPassword(auth, email, password); 
            } catch(e) { 
                notify(friendlyError(e, "로그인하지 못했어요."), "error"); 
            }
        });

        // Signup Action
        document.getElementById("signupBtn").addEventListener("click", async () => {
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();
            const confirm = document.getElementById("signupConfirm").value.trim();
            
            if(!email || !password) return notify("모든 항목을 입력해 주세요.", "error");
            if(password !== confirm) return notify("비밀번호가 서로 달라요. 다시 확인해 주세요.", "error");
            
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", cred.user.uid), {
                    email: email,
                    profilePicUrl: `https://placehold.co/100/0078d7/ffffff?text=${email.charAt(0).toUpperCase()}`,
                    friends: [],
                    personalMessage: '안녕하세요! OpenCard Message입니다.'
                });
                notify("회원가입이 완료됐어요. 로그인해 주세요.", "success");
                document.getElementById('signupBox').classList.add('hidden');
                document.getElementById('loginBox').classList.remove('hidden');
            } catch(e) { 
                notify(friendlyError(e, "회원가입하지 못했어요."), "error"); 
            }
        });

        // Auth State Observer
        onAuthStateChanged(auth, user => {
            const authContainer = document.getElementById('authContainer');
            const mainApp = document.getElementById('mainApp');

            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                mainApp.classList.remove('hidden');
                setupAppUI(user);
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                mainApp.classList.add('hidden');
                unsubscribeAll();
            }
        });

        function setupAppUI(user) {
            setupNavigation();
            setupProfileDropdown();
            setupChat();
            setupProfileEditing();
            
            const userDocRef = doc(db, "users", user.uid);
            const unsubUser = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    document.getElementById('myProfilePic').src = userData.profilePicUrl;
                    document.getElementById('myUserEmail').textContent = userData.email;
                    document.getElementById('myUserStatus').textContent = userData.personalMessage || '상태 메시지 없음';
                    
                    listenForFriends(userData.friends || []);
                }
            }, (err) => notify(friendlyError(err, "내 정보를 불러오지 못했어요."), "error"));
            unsubscribeListeners.push(unsubUser);
        }

        function unsubscribeAll() {
            unsubscribeListeners.forEach(unsub => unsub());
            unsubscribeListeners = [];
        }

        // Navigation Management
        function setupNavigation() {
            const navChatBtn = document.getElementById('navChatBtn');
            const navProfileBtn = document.getElementById('navProfileBtn');
            const chatView = document.getElementById('chatView');
            const profileView = document.getElementById('profileView');

            navChatBtn.addEventListener('click', () => {
                chatView.classList.remove('hidden');
                profileView.classList.add('hidden');
            });

            navProfileBtn.addEventListener('click', () => {
                profileView.classList.remove('hidden');
                chatView.classList.add('hidden');
            });
        }

        // Profile Dropdown
        function setupProfileDropdown() {
            const trigger = document.getElementById('profileDropdownTrigger');
            const dropdown = document.getElementById('profileDropdown');

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('hidden');
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                try { await signOut(auth); } 
                catch(error) { notify(friendlyError(error, "로그아웃하지 못했어요."), "error"); }
            });

            document.addEventListener('click', () => dropdown.classList.add('hidden'));
        }

        // Chat Feature Implementation
        function setupChat() {
            document.getElementById('addFriendBtn').addEventListener('click', async () => {
                const friendEmail = document.getElementById('addFriendEmail').value.trim();
                if (!friendEmail) return notify("친구의 이메일을 입력해 주세요.", "error");
                if (friendEmail === currentUser.email) return notify("내 계정은 친구로 추가할 수 없어요.", "error");

                try {
                    const q = query(collection(db, "users"), where("email", "==", friendEmail));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        notify("이 이메일로 가입한 사용자를 찾을 수 없어요. 이메일을 다시 확인해 주세요.", "error");
                    } else {
                        const friendDoc = querySnapshot.docs[0];
                        const userDocRef = doc(db, "users", currentUser.uid);
                        
                        await updateDoc(userDocRef, { friends: arrayUnion(friendDoc.id) });
                        await updateDoc(doc(db, "users", friendDoc.id), { friends: arrayUnion(currentUser.uid) });
                        
                        notify("친구를 추가했어요!", "success");
                        document.getElementById('addFriendEmail').value = '';
                    }
                } catch(err) {
                    notify(friendlyError(err, "친구를 추가하지 못했어요."), "error");
                }
            });
        }

        function listenForFriends(friendIds = []) {
            const friendsListEl = document.getElementById('friendsList');
            if (!friendIds || friendIds.length === 0) {
                friendsListEl.innerHTML = '<li class="p-3 text-xs text-gray-400 text-center">등록된 친구가 없습니다.</li>';
                return;
            }

            const q = query(collection(db, "users"), where("__name__", "in", friendIds));
            const unsubFriends = onSnapshot(q, (snapshot) => {
                friendsListEl.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const friend = docSnap.data();
                    const friendEl = document.createElement('li');
                    friendEl.className = 'p-2.5 flex items-center space-x-3 cursor-pointer hover:bg-blue-50 rounded-lg transition border border-transparent hover:border-blue-100';
                    friendEl.innerHTML = `
                        <img src="${friend.profilePicUrl}" class="w-9 h-9 rounded-full object-cover border border-gray-200">
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-xs text-gray-800 truncate">${friend.email}</p>
                            <p class="text-[11px] text-gray-500 italic truncate">${friend.personalMessage || ''}</p>
                        </div>`;
                    friendEl.addEventListener('click', () => openChat(docSnap.id, friend));
                    friendsListEl.appendChild(friendEl);
                });
            }, (err) => notify(friendlyError(err, "친구 목록을 불러오지 못했어요."), "error"));
            unsubscribeListeners.push(unsubFriends);
        }

        function openChat(friendUid, friendData) {
            const chatId = [currentUser.uid, friendUid].sort().join('_');
            const chatContainer = document.getElementById('chatContainer');
            
            chatContainer.innerHTML = ''; // Reset container

            const template = document.getElementById('chatWindowTemplate');
            const newChatWindow = template.content.cloneNode(true).firstElementChild;
            newChatWindow.dataset.chatId = chatId;
            newChatWindow.querySelector('.chat-friend-name').textContent = friendData.email;
            newChatWindow.querySelector('.chat-profile-pic').src = friendData.profilePicUrl;
            newChatWindow.querySelector('.chat-friend-status').textContent = friendData.personalMessage || '상태 메시지 없음';

            // Nudge Feature (대화창 흔들기)
            newChatWindow.querySelector('.nudge-btn').addEventListener('click', () => {
                const mainApp = document.getElementById('mainApp');
                mainApp.classList.add('shake');
                setTimeout(() => mainApp.classList.remove('shake'), 600);
                sendMessage(chatId, "🔔 [대화상대에게 흔들기를 보냈습니다]", true);
            });

            // Close Chat Button
            newChatWindow.querySelector('.close-chat-btn').addEventListener('click', () => {
                chatContainer.innerHTML = `
                    <div id="noChatSelected" class="flex flex-col items-center justify-center h-full text-gray-400">
                        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-3">
                            <i class="far fa-comments text-3xl text-blue-500"></i>
                        </div>
                        <p class="text-sm font-medium text-gray-600">친구를 선택하여 메시지를 주고받으세요.</p>
                        <p class="text-xs text-gray-400 mt-1">왼쪽 친구 목록에서 대화 상대를 클릭하세요.</p>
                    </div>`;
            });

            const chatInput = newChatWindow.querySelector('.chat-input');
            const sendBtn = newChatWindow.querySelector('.send-msg-btn');

            const handleSend = async () => {
                const text = chatInput.value.trim();
                if (!text) return;
                chatInput.value = '';
                const ok = await sendMessage(chatId, text);
                // Put the text back so it isn't lost if sending failed
                if (!ok && !chatInput.value) chatInput.value = text;
            };

            sendBtn.addEventListener('click', handleSend);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            const messagesContainer = newChatWindow.querySelector('.chat-messages');
            const messagesQuery = query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp", "asc"));
            
            const unsubMessages = onSnapshot(messagesQuery, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    displayMessage(messagesContainer, docSnap.data());
                });
            }, (err) => notify(friendlyError(err, "대화 내용을 불러오지 못했어요."), "error"));
            unsubscribeListeners.push(unsubMessages);

            chatContainer.appendChild(newChatWindow);
        }

        async function sendMessage(chatId, content, isNudge = false) {
            try {
                await addDoc(collection(db, `chats/${chatId}/messages`), {
                    senderId: currentUser.uid,
                    content: content,
                    isNudge: isNudge,
                    timestamp: serverTimestamp()
                });
                return true;
            } catch (err) {
                notify(friendlyError(err, "메시지를 보내지 못했어요."), "error");
                return false;
            }
        }

        function displayMessage(container, message) {
            const msgEl = document.createElement('div');
            const isMe = message.senderId === currentUser.uid;
            
            msgEl.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

            if(message.isNudge) {
                msgEl.className = 'flex justify-center my-1';
                msgEl.innerHTML = `<span class="bg-amber-100 text-amber-800 text-[11px] px-3 py-1 rounded-full font-semibold border border-amber-200">${message.content}</span>`;
            } else {
                msgEl.innerHTML = `
                    <div class="max-w-xs md:max-w-md px-3.5 py-2 rounded-2xl text-xs shadow-sm break-words ${
                        isMe 
                            ? 'bg-blue-600 text-white rounded-br-none' 
                            : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'
                    }">
                        ${escapeHtml(message.content)}
                    </div>`;
            }
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        // Profile Editing Logic
        function setupProfileEditing() {
            const unsub = onSnapshot(doc(db, "users", currentUser.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    document.getElementById('profileEditPic').src = userData.profilePicUrl;
                    document.getElementById('profilePersonalMessage').value = userData.personalMessage || '';
                }
            }, (err) => notify(friendlyError(err, "프로필을 불러오지 못했어요."), "error"));
            unsubscribeListeners.push(unsub);

            document.getElementById('saveProfileBtn').addEventListener('click', async () => {
                const newPersonalMessage = document.getElementById('profilePersonalMessage').value.trim();
                const file = document.getElementById('profilePicInput').files[0];
                const btn = document.getElementById('saveProfileBtn');
                
                btn.disabled = true;
                btn.textContent = '저장 중...';

                try {
                    const userDocRef = doc(db, "users", currentUser.uid);
                    let downloadURL;

                    if (file) {
                        const storageRef = ref(storage, `profile_pics/${currentUser.uid}`);
                        await uploadBytes(storageRef, file);
                        downloadURL = await getDownloadURL(storageRef);
                    }

                    const updateData = { personalMessage: newPersonalMessage };
                    if (downloadURL) updateData.profilePicUrl = downloadURL;

                    await updateDoc(userDocRef, updateData);
                    notify('프로필을 저장했어요.', 'success');
                    document.getElementById('profilePicInput').value = '';
                } catch(error) { 
                    notify(friendlyError(error, "프로필을 저장하지 못했어요."), "error");
                } finally { 
                    btn.disabled = false; 
                    btn.textContent = '설정 저장'; 
                }
            });
        }

        // Utility: HTML Escaping
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
